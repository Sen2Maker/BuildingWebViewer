# Manual reviewed online-preview web deployment; the v1.0 App release remains unchanged.
# Pushing source to main does not publish Pages or an App.
name: Reviewed Vite Pages deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify unchanged v1.0 App release and reviewed web-only source delta
        run: |
          python3 - <<'PYVERIFY'
          import json, urllib.request
          def read(path):
              with urllib.request.urlopen('https://api.github.com/repos/Sen2Maker/BuildingWebViewer/'+path) as r: return json.load(r)
          release=read('releases/tags/v1.0')
          assert release['draft'] is False and release['prerelease'] is False
          assert read('git/ref/tags/v1.0')['object']['sha']=='1cbbbf5e1ad875e552e1993fe1adf100b75e601d'
          expected={'BuildingWebViewer-v1.0-source.zip': (6963569, 'a17cac1a140a4554ded17f709babb541a52a2c18c605773959b60a9acc49f3d3'), 'BuildingWebViewer-v1.0.apk': (17053051, 'e04cf43657944123437b4e9e9414092119e5669654ce567f64cc73d90bf6a0f4'), 'BuildingWebViewer-v1.0-source-build-materials.zip': (11522, 'a4c2656e1629623d8355f18c92a335c8a56e440375263b2df2244a86668a7c7d'), 'BUILD-AND-SOURCE.md': (2523, '5e1c6fe34c2f7993a71d8901fda0e9892cdaaa2579499ddf06d9b741dccb20fd'), 'VERIFICATION.json': (1002, '6e7a0d3c8af499a2e1670bfb8e313ff9ab02ce077ace613fc048077c751f5e36'), 'source-archives-manifest.json': (2270, '5421dca59ac1a8d0915c9ebc2f7b2d514318ec7cd782691c35e25344e0c60879'), 'kotlin-stdlib-2.0.21-sources.jar': (633845, '5995c780c3ac742fb277ced561ebd7b0739227ea7c93a6bd9c7cee6593493fce'), 'libarchive-9525f90c-source.tar.gz': (5920582, '944db9ab58a3cbdb5d947db4f04a3cc15f83b3147fcf7830ada592ba8d4a102c'), 'libarchive-android-d3ee9c47-source.tar.gz': (101812, '0f888473865d88c464f47db786de79832ec23d368f62bfa7f6f298e970d62ac1'), 'mediabunny-1.61.4.tgz': (2186598, '974fbe5071a7be0d3de7cbf9567f65e7ca83a215a042f6a2d947e3387acda2c9'), 'mediabunny-d901f02d-source.tar.gz': (64666092, 'c31e30589bc061b44a1c495346446f59e63a59dcfccb09c8e7aa7570a86dc694'), 'SHA256SUMS.txt': (1070, 'f38fdf90880ea2314221c55be19b9c6588aa8e58ac83ce6ebb34e975c047de92')}
          actual={x['name']:x for x in release['assets']}
          for name,(size,sha) in expected.items():
              assert name in actual and actual[name]['size']==size and actual[name]['digest']=='sha256:'+sha and actual[name]['state']=='uploaded', name
          comparison=read('compare/a3ed4a3c19f5a8cb0141d255f79e8261e70c1973...cfb8334fc9492be1dc41a9d42fd0754a56737a97')
          assert comparison['status']=='ahead' and comparison['total_commits']==1
          expected_web_delta={'app.config.json': '59bac2426c69125807df585b2b3edb5ca8ec5b9f', 'docs/online-comparison-handoff.md': 'ef0e4a7a3f4383ca1d8b29715ea5ba1534c8ba69', 'docs/online-preview.md': 'efd9da4e205c321252decd493852fb3ca147214e', 'src/compare/app.js': '83fd966965c4e6fe8de83603db4f822534e9f984', 'src/compare/compare.css': 'c1baea19ce0a4114ed9111cf4557f8071be1bf5c', 'src/compare/point-worker.js': 'cdd9f684a9aed061f041ecdfc7eff948e06699ef', 'src/compare/renderer.js': '7e84af94b9d6529587c92cc3124f8f7f7f27ca39', 'src/compare/session.js': '6409dfdcba06add6b9c41a831a0b11589c64bb95', 'src/entries/compare.js': '0da52437b8a4e56e6dcd04ea815f12b83eb3d406', 'src/pages/compare.html': '18633cc5d89d054625029a7068640a000cc426a8', 'src/shared/online-compare-core.js': '0584b61d598512a7875b0293e1b0f5d317af2e7d', 'src/shared/online-preview.css': '1e2d148f4b8fe9b389dab727c1a06cb2d69a23f1', 'src/shared/online-preview.js': '60a456d3396faef65502dc66be11de6fae84c363', 'src/shared/page-boot.js': '3895bf9061e8f7b189fea82349c0ec485afa1bdf', 'src/shared/preference-storage.js': 'a862cf77b8576781f2e5b72fa27c744ffa2d5bb3', 'src/shared/site-meta.json': '38ee299fbd3dcbce83b3516c05938213cf47511a', 'tests/online-compare-app.test.mjs': '6ede7ba4fcabdb9c298b039ac6477a5a4eedf31a', 'tests/online-compare-core.test.mjs': 'f6ec893963716c8283d176541703b8cc2c5bb2ad', 'tests/online-compare-renderer.test.mjs': 'f7b2dbfff0093e940edd244f040e8abe70af91db', 'tests/online-compare-session.test.mjs': 'f693b428359a15d27c21150bd61c924f8eff4cf8', 'tests/online-preview-runtime.test.mjs': '086fe997382218ad3f2c8f2c24168eeccec2f590'}
          assert {x['filename']:x['sha'] for x in comparison['files']}==expected_web_delta, 'Unreviewed source changes'
          assert all(x['status'] in ['modified','added'] for x in comparison['files'])
          print('Exact 21 frozen comparison handoff files verified; App release unchanged')
          PYVERIFY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: cfb8334fc9492be1dc41a9d42fd0754a56737a97
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify reviewed web output separately from unchanged App release
        run: |
          python3 scripts/package.py --check
          echo "1109d245bc68dca56e0aa03b9cacabdd5ac99f9b0dfbae5135adc89ce82b2609  dist/asset-inventory.json" | sha256sum --check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
