# Manual reviewed online-preview web deployment; the v1.0 App release remains unchanged.
# Pushing source to main does not publish Pages or an App.
name: Reviewed Vite Pages deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify unchanged v1.0 App release and reviewed web-only source delta
        run: |
          python3 - <<'PYVERIFY'
          import json, urllib.request
          def read(path):
              with urllib.request.urlopen('https://api.github.com/repos/Sen2Maker/BuildingWebViewer/'+path) as r: return json.load(r)
          release=read('releases/tags/v1.0')
          assert release['draft'] is False and release['prerelease'] is False
          assert read('git/ref/tags/v1.0')['object']['sha']=='1cbbbf5e1ad875e552e1993fe1adf100b75e601d'
          expected={'BuildingWebViewer-v1.0-source.zip': (6963569, 'a17cac1a140a4554ded17f709babb541a52a2c18c605773959b60a9acc49f3d3'), 'BuildingWebViewer-v1.0.apk': (17053051, 'e04cf43657944123437b4e9e9414092119e5669654ce567f64cc73d90bf6a0f4'), 'BuildingWebViewer-v1.0-source-build-materials.zip': (11522, 'a4c2656e1629623d8355f18c92a335c8a56e440375263b2df2244a86668a7c7d'), 'BUILD-AND-SOURCE.md': (2523, '5e1c6fe34c2f7993a71d8901fda0e9892cdaaa2579499ddf06d9b741dccb20fd'), 'VERIFICATION.json': (1002, '6e7a0d3c8af499a2e1670bfb8e313ff9ab02ce077ace613fc048077c751f5e36'), 'source-archives-manifest.json': (2270, '5421dca59ac1a8d0915c9ebc2f7b2d514318ec7cd782691c35e25344e0c60879'), 'kotlin-stdlib-2.0.21-sources.jar': (633845, '5995c780c3ac742fb277ced561ebd7b0739227ea7c93a6bd9c7cee6593493fce'), 'libarchive-9525f90c-source.tar.gz': (5920582, '944db9ab58a3cbdb5d947db4f04a3cc15f83b3147fcf7830ada592ba8d4a102c'), 'libarchive-android-d3ee9c47-source.tar.gz': (101812, '0f888473865d88c464f47db786de79832ec23d368f62bfa7f6f298e970d62ac1'), 'mediabunny-1.61.4.tgz': (2186598, '974fbe5071a7be0d3de7cbf9567f65e7ca83a215a042f6a2d947e3387acda2c9'), 'mediabunny-d901f02d-source.tar.gz': (64666092, 'c31e30589bc061b44a1c495346446f59e63a59dcfccb09c8e7aa7570a86dc694'), 'SHA256SUMS.txt': (1070, 'f38fdf90880ea2314221c55be19b9c6588aa8e58ac83ce6ebb34e975c047de92')}
          actual={x['name']:x for x in release['assets']}
          for name,(size,sha) in expected.items():
              assert name in actual and actual[name]['size']==size and actual[name]['digest']=='sha256:'+sha and actual[name]['state']=='uploaded', name
          comparison=read('compare/b6cf02e672a026b98a61a2cbd7c32b5f71e54edf...9ae24f37781e76f2dfc0b3042ada1fa3aab86f4a')
          assert comparison['status']=='ahead' and comparison['total_commits']==1
          expected_web_delta={'docs/online-preview.md': 'd68ab4a60d3fdc641f1698a69e3c9c24f1b3172e', 'scripts/check-preview-resources.mjs': 'e970c7187c06bd857db87e3373c0357d8e280e3b', 'scripts/pack-preview-xyz.mjs': 'be67cf92c542c0ae93415f629146a55e12963d0a', 'scripts/preview-fixtures.mjs': '24875e8fa5db0d0a0d588927518e00e755aa1b2f', 'src/cloud/cloud-app.js': '9ac0f34e8d385125d68b15b5b79e0fa439ff4097', 'src/hub/hub.js': 'aa1498c1e435492a9ff859b3bbf2c80b116429e2', 'src/lod/app.js': '30f36af448768a935ab0ff0d9fe619ffb758d49a', 'src/shared/animation-controls.js': '202b2631e41b8620f06c1ad0d7e57708e9bdf298', 'src/shared/camera-controls.js': '2879f22b92e2d54ff8ce029c20684474eaf07cff', 'src/shared/fly-controls.js': 'b8ba8acf9bd9efd0bbf67a7cb8397e8c058377a1', 'src/shared/i18n.js': '0067b86c2c940cd3d1b43632f4475c54edfb4787', 'src/shared/navigation-adapter.js': '03b4e3d3ff353e8d6665bba231185976324215b2', 'src/shared/online-preview-core.js': 'b884be7c7b4a703a04d28b69260e269ba563f1e5', 'src/shared/online-preview-data.js': '002740fd26b1b5f5ae11ba76cd638a3587c61bba', 'src/shared/online-preview-source.js': '0cbd3a24fcdb32305bd563b001a817e92a3feeec', 'src/shared/online-preview.css': '56b31031003740f12e795a727dc8f17fa8ea58fb', 'src/shared/online-preview.js': '2361e4fbadb61def999a2105fa9d5ff1d95baa6d', 'src/shared/page-boot.js': '4de4f1d5e3507005335a0bd4a114a6f3d5a64807', 'src/shared/palettes.js': 'ece5f67ca7614a5442703d882f24d3274220e63e', 'src/shared/preference-storage.js': 'bc897e788df42e40721b670164fb5b5943e9cc3f', 'src/shared/render-diagnostics.js': '53c9980ea0e346ef65353e695e21530bfdc2100d', 'src/shared/render-style.js': 'ba52aadfa1720b1478821b84085bda2bf1a465de', 'src/shared/sidebar.js': '62e3b4b458f3c467d315048a15f67674349a8c07', 'tests/helpers/preview-resource-server.mjs': '7a137698a0f7e7a4fbbd66ec158f0ba110227ff4', 'tests/online-preview-chunks.test.mjs': '3d27801beedb8724c29cf853618fd2a2e6b62f9f', 'tests/online-preview-core.test.mjs': 'a67a225a0cc78d0ba20ff017456acde9fc40b7d4', 'tests/online-preview-http.test.mjs': '7c097d9bef1a0c1d71e4cfe737579634bd0e588b', 'tests/online-preview-pack.test.mjs': 'ee52d36d190de821cda4146f5a752bd0b6905e03', 'tests/online-preview-parser.test.mjs': '9543f95be3b8bcd44d65f2bcd966239a686d4592', 'tests/online-preview-preflight.test.mjs': '229f06174c4bea2880929fad57a32b8ee77cb9f0', 'tests/online-preview-runtime.test.mjs': 'a9652db4f3be399a4c99ddd987adb74043177b2e', 'tests/online-preview-session.test.mjs': '4d82a405b3cd0351fc3b20743063456e1327647a', 'tests/online-preview-source.test.mjs': '402a344c6676d60e3a8e8bb9eaa1519358104993'}
          assert {x['filename']:x['sha'] for x in comparison['files']}==expected_web_delta, 'Unreviewed source changes'
          assert all(x['status'] in ['modified','added'] for x in comparison['files'])
          print('Exact 33 reviewed online-preview source files verified; App release unchanged')
          PYVERIFY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: 9ae24f37781e76f2dfc0b3042ada1fa3aab86f4a
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify reviewed web output separately from unchanged App release
        run: |
          python3 scripts/package.py --check
          echo "edfe922e8f98a853b1dc04d4600f6d365f207df1b7d23a7859cdc74b26ccf66f  dist/asset-inventory.json" | sha256sum --check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
