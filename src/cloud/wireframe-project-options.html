<details class="format-help"><summary>格式与管理说明</summary><p>支持 ID.obj 或 ID 文件夹中的多个 OBJ；同名 ID 的点云可一起读取，两种结构可以混合导入。</p><p>点云：XYZ / TXT / CSV / PTS、PLY（文本 / 二进制）、PCD（文本 / 未压缩二进制）。LAS / LAZ、压缩 PCD 暂不支持。</p><p id="source-note">选择含各数据 ID 子目录的根文件夹，不预设路径。</p><p>单个 ID 或多个 ID 叠加；全选、反选只操作搜索匹配项。Ctrl / Shift 多选用于移动或移除项目条目。</p></details>
