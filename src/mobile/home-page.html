<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BuildingWebViewer · Projects</title>
<link rel="stylesheet" href="/assets/mobile/style.css">
</head>
<body>
<header>
<img src="/favicon.svg" alt="" width="36" height="36">
<div>
<h1>BuildingWebViewer</h1>
<p>本地项目 · 三维工具</p>
</div>
<a href="?lang=en" id="mobile-language">中文 / English</a>
</header>
<main>
<section class="mobile-intro">
<h2>我的项目</h2>
<p>文件保存在本机。选择一个项目，再打开查看工具。</p>
<div class="mobile-actions primary-actions">
<button id="new-project">新建项目</button>
<button id="import-project">导入文件 / 压缩包</button>
</div>
<p id="status" role="status" aria-live="polite"></p>
</section>
<section id="projects" aria-label="我的项目">
</section>
</main>
<footer>
<div class="footer-actions">
<button id="show-updates">版本与更新</button>
<button id="trash">回收站</button>
</div>
<section id="mobile-updates" hidden>
<h2>版本与更新</h2>
<div class="mobile-actions">
<button id="check-update">更新状态</button>
<button id="show-release-notes">本地版本说明</button>
</div>
<p id="update-status" role="status" aria-live="polite"></p>
</section>
<details class="mobile-more mobile-other-tools">
<summary>更多工具</summary>
<p>CAD App 独立安装和管理文件，不会自动传送本机项目。</p>
<div class="mobile-actions">
<button id="cad-app-download" type="button">下载 CAD App</button>
</div>
</details>
<details class="mobile-more">
<summary>帮助与维护</summary>
<div class="mobile-actions">
<button id="native-recovery" type="button">原生恢复与导出</button>
<a class="mobile-action-link" id="device-self-test" href="self-test.html">设备自检</a>
<button id="show-diagnostics">渲染诊断</button>
<button id="clean-storage" disabled>清理暂不可用</button>
<button id="empty-trash" disabled>永久删除暂不可用</button>
</div>
<p>为保护中断写入的项目，清理与清空回收站暂时关闭。仍可移入回收站和恢复。</p>
<p id="version-info">本地离线可用</p>
<p>卸载或换机前，请导出项目并确认备份可重新导入。系统自动备份和迁移已排除。</p>
<a href="notices.html">第三方声明</a> · <a href="../vendor/main-notices/NOTICE.txt">补充声明与源码交付状态</a>
</details>
</footer>
<script type="module" src="/src/entries/mobile.js">
</script>
</body>
</html>
